name: setup

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v6.0.2
      - name: user node.js 18
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '18'
      - name: install and build
        run: make setup
      - name: run tests
        run: make test
      - name: run linter
        run: make lint

